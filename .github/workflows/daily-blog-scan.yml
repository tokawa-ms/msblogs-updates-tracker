name: Daily Blog Scan

on:
  schedule:
    # 23:00 UTC every day, which is 08:00 JST (UTC+9) on the next day.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Scan date (YYYY-MM-DD, JST). Empty uses today in Japan."
        required: false
        type: string
      force:
        description: "Force PR creation even if no content changes are detected."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-blog-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan_and_create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Resolve dates
        id: dates
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            # Blog updates are processed by Japanese local date.
            # The scheduled run starts at 23:00 UTC, when the intended scan date is already the next day in JST.
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          YESTERDAY_DATE="$(TZ=Asia/Tokyo date -d "${TARGET_DATE} -1 day" +%F)"
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "yesterday_date=${YESTERDAY_DATE}" >> "$GITHUB_OUTPUT"

      - name: Fetch latest blogs
        run: node scripts/fetch-blogs.js "${{ steps.dates.outputs.target_date }}"

      - name: Analyze diff
        run: node scripts/diff-analyzer.js "${{ steps.dates.outputs.target_date }}" "${{ steps.dates.outputs.yesterday_date }}"

      - name: Generate daily markdown page
        run: node scripts/generate-daily-page.js "${{ steps.dates.outputs.target_date }}"

      - name: Write force-run marker
        if: ${{ inputs.force == true }}
        shell: bash
        run: |
          mkdir -p cache
          printf '{"forced_at":"%s","date":"%s","run_id":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ steps.dates.outputs.target_date }}" \
            "${{ github.run_id }}" \
            > cache/forced-run.json

      - name: Create pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/daily-updates-${{ steps.dates.outputs.target_date }}
          delete-branch: true
          title: "chore: daily blog updates for ${{ steps.dates.outputs.target_date }}"
          body: |
            ## Daily blog updates

            - Date: `${{ steps.dates.outputs.target_date }}`
            - Compared with: `${{ steps.dates.outputs.yesterday_date }}`
            - Triggered by: `${{ github.workflow }}`
            - Forced: `${{ inputs.force }}`
          commit-message: "chore: generate daily blog updates (${{ steps.dates.outputs.target_date }})"
          labels: automation
          add-paths: |
            cache/blogs
            cache/diff
            content/updates
            src/content/updates
            cache/forced-run.json

      - name: Report result
        shell: bash
        run: |
          if [ "${{ steps.create_pr.outputs.pull-request-created }}" = "true" ]; then
            echo "### ✅ Pull request created" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **PR:** ${{ steps.create_pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Branch:** \`automation/daily-updates-${{ steps.dates.outputs.target_date }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Forced:** \`${{ inputs.force }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "PR created: ${{ steps.create_pr.outputs.pull-request-url }}"
          else
            echo "### ℹ️ No changes detected — PR was not created" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Date:** \`${{ steps.dates.outputs.target_date }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Reason:** The generated files and cache snapshots are identical to the current \`main\` branch." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Tip:** Re-run with \`force: true\` to create a PR regardless of changes." >> "$GITHUB_STEP_SUMMARY"
            echo "No changes detected for ${{ steps.dates.outputs.target_date }} — PR skipped."
          fi
