name: Daily Blog Scan

on:
  schedule:
    # 23:00 UTC every day, which is 08:00 JST (UTC+9) on the next day.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Scan date (YYYY-MM-DD, JST). Empty uses today in Japan.'
        required: false
        type: string
      regenerate_start_date:
        description: 'Regenerate from saved diffs starting on this date (YYYY-MM-DD).'
        required: false
        type: string
      regenerate_end_date:
        description: 'Regenerate from saved diffs through this date (YYYY-MM-DD).'
        required: false
        type: string
      update_branch:
        description: 'Branch to update. Defaults to main.'
        required: false
        type: string
        default: 'main'
      force:
        description: 'Force deployment even if no content changes are detected.'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-blog-scan-main
  cancel-in-progress: false

env:
  TRACKED_UPDATE_PATHS: 'cache/blogs cache/diff cache/summaries content/updates src/content/updates cache/forced-run.json'

jobs:
  scan_commit_and_build:
    name: Scan, commit, and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changes_detected: ${{ steps.changes.outputs.changes_detected }}
      publish_ready: ${{ steps.changes.outputs.publish_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.update_branch || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Resolve dates
        id: dates
        shell: bash
        env:
          TARGET_DATE_INPUT: ${{ github.event.inputs.target_date }}
          REGENERATE_START_DATE_INPUT: ${{ github.event.inputs.regenerate_start_date }}
          REGENERATE_END_DATE_INPUT: ${{ github.event.inputs.regenerate_end_date }}
        run: |
          is_valid_date() {
            [[ "$1" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] &&
              [ "$(date -d "$1" +%F 2>/dev/null)" = "$1" ]
          }

          if [ -n "$REGENERATE_START_DATE_INPUT" ] || [ -n "$REGENERATE_END_DATE_INPUT" ]; then
            if [ -n "$TARGET_DATE_INPUT" ]; then
              echo "::error::target_date cannot be combined with a regeneration range."
              exit 1
            fi
            if ! is_valid_date "$REGENERATE_START_DATE_INPUT" || ! is_valid_date "$REGENERATE_END_DATE_INPUT"; then
              echo "::error::Both regeneration dates must use a valid YYYY-MM-DD value."
              exit 1
            fi
            if [[ "$REGENERATE_START_DATE_INPUT" > "$REGENERATE_END_DATE_INPUT" ]]; then
              echo "::error::regenerate_start_date must be on or before regenerate_end_date."
              exit 1
            fi
            echo "mode=regenerate" >> "$GITHUB_OUTPUT"
            echo "start_date=$REGENERATE_START_DATE_INPUT" >> "$GITHUB_OUTPUT"
            echo "end_date=$REGENERATE_END_DATE_INPUT" >> "$GITHUB_OUTPUT"
            echo "display_date=$REGENERATE_START_DATE_INPUT..$REGENERATE_END_DATE_INPUT" >> "$GITHUB_OUTPUT"
          elif [ -n "$TARGET_DATE_INPUT" ]; then
            if ! is_valid_date "$TARGET_DATE_INPUT"; then
              echo "::error::target_date must use a valid YYYY-MM-DD value."
              exit 1
            fi
            TARGET_DATE="$TARGET_DATE_INPUT"
          else
            # Blog updates are processed by Japanese local date.
            # The scheduled run starts at 23:00 UTC, when the intended scan date is already the next day in JST.
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi

          if [ -n "${TARGET_DATE:-}" ]; then
            YESTERDAY_DATE="$(TZ=Asia/Tokyo date -d "${TARGET_DATE} -1 day" +%F)"
            echo "mode=daily" >> "$GITHUB_OUTPUT"
            echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
            echo "yesterday_date=${YESTERDAY_DATE}" >> "$GITHUB_OUTPUT"
            echo "display_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest blogs
        if: ${{ steps.dates.outputs.mode == 'daily' }}
        run: node scripts/fetch-blogs.js "${{ steps.dates.outputs.target_date }}"

      - name: Analyze diff
        if: ${{ steps.dates.outputs.mode == 'daily' }}
        run: node scripts/diff-analyzer.js "${{ steps.dates.outputs.target_date }}" "${{ steps.dates.outputs.yesterday_date }}"

      - name: Generate daily markdown page
        id: generate
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL || 'gpt-5.4' }}
        shell: bash
        run: |
          if [ "${{ steps.dates.outputs.mode }}" = "regenerate" ]; then
            node scripts/generate-daily-page.js \
              "${{ steps.dates.outputs.start_date }}" \
              "${{ steps.dates.outputs.end_date }}"
          else
            node scripts/generate-daily-page.js "${{ steps.dates.outputs.target_date }}"
          fi

      - name: Write force-run marker
        if: ${{ inputs.force == true }}
        shell: bash
        run: |
          mkdir -p cache
          printf '{"forced_at":"%s","date":"%s","run_id":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ steps.dates.outputs.display_date }}" \
            "${{ github.run_id }}" \
            > cache/forced-run.json

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          IFS=' ' read -r -a tracked_paths <<< "$TRACKED_UPDATE_PATHS"
          if [ -z "$(git status --porcelain -- "${tracked_paths[@]}")" ]; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.generate.outcome }}" = "success" ]; then
              echo "publish_ready=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Report no changes
        if: ${{ steps.changes.outputs.changes_detected == 'false' && steps.generate.outcome == 'success' }}
        shell: bash
        run: |
          echo "### ℹ️ No changes detected — main was not updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date or range:** \`${{ steps.dates.outputs.display_date }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason:** The generated files and cache snapshots are identical to the current \`main\` branch." >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tip:** Re-run with \`force: true\` to commit and deploy regardless of content changes." >> "$GITHUB_STEP_SUMMARY"
          echo "No changes detected for ${{ steps.dates.outputs.display_date }} — main update and Pages deployment skipped."

      - name: Generate static site
        if: ${{ steps.changes.outputs.publish_ready == 'true' }}
        run: npm run build

      - name: Setup Pages
        if: ${{ steps.changes.outputs.publish_ready == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.changes.outputs.publish_ready == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Commit and push changes
        if: ${{ steps.changes.outputs.changes_detected == 'true' }}
        shell: bash
        env:
          UPDATE_BRANCH: ${{ inputs.update_branch || 'main' }}
        run: |
          IFS=' ' read -r -a tracked_paths <<< "$TRACKED_UPDATE_PATHS"
          git add "${tracked_paths[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate daily blog updates (${{ steps.dates.outputs.display_date }})"
          if ! git push origin "HEAD:${UPDATE_BRANCH}"; then
            echo "::error::Failed to push generated updates to ${UPDATE_BRANCH}. Ensure Actions workflow has Read and write permissions enabled and verify branch protection rules." >&2
            exit 1
          fi

      - name: Report update result
        if: ${{ steps.changes.outputs.publish_ready == 'true' }}
        shell: bash
        run: |
          echo "### ✅ Daily updates committed and Pages artifact prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date or range:** \`${{ steps.dates.outputs.display_date }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode:** \`${{ steps.dates.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${{ inputs.update_branch || 'main' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Forced:** \`${{ inputs.force }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment mode:** \`GitHub Actions\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`dist/\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Report resumable generation failure
        if: ${{ steps.generate.outcome == 'failure' }}
        shell: bash
        run: |
          echo "### Generation stopped after saving validated summary checkpoints" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run the same date or range to resume from the committed cache." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy:
    name: Deploy to GitHub Pages
    needs: scan_commit_and_build
    if: ${{ needs.scan_commit_and_build.outputs.publish_ready == 'true' && (inputs.update_branch == '' || inputs.update_branch == 'main') }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
