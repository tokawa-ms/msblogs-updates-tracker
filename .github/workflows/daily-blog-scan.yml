name: Daily Blog Scan

on:
  schedule:
    # 23:00 UTC every day, which is 08:00 JST (UTC+9) on the next day.
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Scan date (YYYY-MM-DD, JST). Empty uses today in Japan."
        required: false
        type: string
      force:
        description: "Force deployment even if no content changes are detected."
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-blog-scan-main
  cancel-in-progress: false

env:
  TRACKED_UPDATE_PATHS: "cache/blogs cache/diff content/updates src/content/updates cache/forced-run.json"

jobs:
  scan_commit_and_build:
    name: Scan, commit, and build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changes_detected: ${{ steps.changes.outputs.changes_detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual dispatch can be started from another branch, but daily publishing always updates the `main` branch.
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Run tests
        run: npm test

      - name: Resolve dates
        id: dates
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            # Blog updates are processed by Japanese local date.
            # The scheduled run starts at 23:00 UTC, when the intended scan date is already the next day in JST.
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          YESTERDAY_DATE="$(TZ=Asia/Tokyo date -d "${TARGET_DATE} -1 day" +%F)"
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "yesterday_date=${YESTERDAY_DATE}" >> "$GITHUB_OUTPUT"

      - name: Fetch latest blogs
        run: node scripts/fetch-blogs.js "${{ steps.dates.outputs.target_date }}"

      - name: Analyze diff
        run: node scripts/diff-analyzer.js "${{ steps.dates.outputs.target_date }}" "${{ steps.dates.outputs.yesterday_date }}"

      - name: Generate daily markdown page
        run: node scripts/generate-daily-page.js "${{ steps.dates.outputs.target_date }}"

      - name: Write force-run marker
        if: ${{ inputs.force == true }}
        shell: bash
        run: |
          mkdir -p cache
          printf '{"forced_at":"%s","date":"%s","run_id":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ steps.dates.outputs.target_date }}" \
            "${{ github.run_id }}" \
            > cache/forced-run.json

      - name: Detect and stage generated changes
        id: changes
        shell: bash
        run: |
          read -r -a tracked_paths <<< "$TRACKED_UPDATE_PATHS"
          if [ -z "$(git status --porcelain -- "${tracked_paths[@]}")" ]; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          else
            git add "${tracked_paths[@]}"
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report no changes
        if: ${{ steps.changes.outputs.changes_detected == 'false' }}
        shell: bash
        run: |
          echo "### ℹ️ No changes detected — main was not updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** \`${{ steps.dates.outputs.target_date }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason:** The generated files and cache snapshots are identical to the current \`main\` branch." >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tip:** Re-run with \`force: true\` to commit and deploy regardless of content changes." >> "$GITHUB_STEP_SUMMARY"
          echo "No changes detected for ${{ steps.dates.outputs.target_date }} — main update and Pages deployment skipped."

      - name: Generate static site
        if: ${{ steps.changes.outputs.changes_detected == 'true' }}
        run: npm run build

      - name: Setup Pages
        if: ${{ steps.changes.outputs.changes_detected == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.changes.outputs.changes_detected == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Commit and push changes
        if: ${{ steps.changes.outputs.changes_detected == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate daily blog updates (${{ steps.dates.outputs.target_date }})"
          git push origin HEAD:main

      - name: Report update result
        if: ${{ steps.changes.outputs.changes_detected == 'true' }}
        shell: bash
        run: |
          echo "### ✅ Daily updates committed and Pages artifact prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** \`${{ steps.dates.outputs.target_date }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Compared with:** \`${{ steps.dates.outputs.yesterday_date }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`main\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Forced:** \`${{ inputs.force }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment mode:** \`GitHub Actions\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`dist/\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: scan_commit_and_build
    if: ${{ needs.scan_commit_and_build.outputs.changes_detected == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
