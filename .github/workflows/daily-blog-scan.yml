name: Daily Blog Scan

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Scan date (YYYY-MM-DD, UTC). Empty uses today."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-blog-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan_and_create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Resolve dates
        id: dates
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            TARGET_DATE="${{ github.event.inputs.target_date }}"
          else
            TARGET_DATE="$(date -u +%F)"
          fi
          YESTERDAY_DATE="$(date -u -d "${TARGET_DATE} -1 day" +%F)"
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "yesterday_date=${YESTERDAY_DATE}" >> "$GITHUB_OUTPUT"

      - name: Fetch latest blogs
        run: node scripts/fetch-blogs.js

      - name: Analyze diff
        run: node scripts/diff-analyzer.js "${{ steps.dates.outputs.target_date }}" "${{ steps.dates.outputs.yesterday_date }}"

      - name: Generate daily markdown page
        run: node scripts/generate-daily-page.js "${{ steps.dates.outputs.target_date }}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automation/daily-updates-${{ steps.dates.outputs.target_date }}
          delete-branch: true
          title: "chore: daily blog updates for ${{ steps.dates.outputs.target_date }}"
          body: |
            ## Daily blog updates

            - Date: `${{ steps.dates.outputs.target_date }}`
            - Compared with: `${{ steps.dates.outputs.yesterday_date }}`
            - Triggered by: `${{ github.workflow }}`
          commit-message: "chore: generate daily blog updates (${{ steps.dates.outputs.target_date }})"
          labels: automation
          add-paths: |
            content/updates
            cache/diff
