name: Astro Preview Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_preview:
    name: Build Astro HTML artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Run tests
        run: npm test

      - name: Build Astro site
        run: npm run build

      - name: Upload Astro artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Summarize result
        shell: bash
        run: |
          echo "### ✅ Astro HTML build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`astro-dist\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Output directory:** \`dist/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Next step:** If this looks good, you can rely on the scheduled daily scan plus the main-branch publish workflow for daily updates." >> "$GITHUB_STEP_SUMMARY"
