name: Analyze Blogs

on:
  workflow_call:
    inputs:
      target_date:
        description: "Analysis date (YYYY-MM-DD, UTC)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_date:
        description: "Analysis date (YYYY-MM-DD, UTC). Empty uses today."
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Resolve target date
        id: dates
        shell: bash
        run: |
          DATE_INPUT="${{ inputs.target_date || github.event.inputs.target_date }}"
          if [ -n "${DATE_INPUT}" ]; then
            TARGET_DATE="${DATE_INPUT}"
          else
            TARGET_DATE="$(date -u +%F)"
          fi
          YESTERDAY_DATE="$(date -u -d "${TARGET_DATE} -1 day" +%F)"
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "yesterday_date=${YESTERDAY_DATE}" >> "$GITHUB_OUTPUT"

      - name: Fetch latest blogs
        run: node scripts/fetch-blogs.js

      - name: Analyze diff
        run: node scripts/diff-analyzer.js "${{ steps.dates.outputs.target_date }}" "${{ steps.dates.outputs.yesterday_date }}"

      - name: Generate daily markdown page
        run: node scripts/generate-daily-page.js "${{ steps.dates.outputs.target_date }}"
