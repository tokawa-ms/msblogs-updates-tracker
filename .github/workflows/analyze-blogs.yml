name: Analyze Blogs

on:
  workflow_call:
    inputs:
      target_date:
        description: "Analysis date (YYYY-MM-DD, UTC)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_date:
        description: "Analysis date (YYYY-MM-DD, UTC). Empty uses today."
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve target date
        id: dates
        shell: bash
        run: |
          DATE_INPUT="${{ inputs.target_date || github.event.inputs.target_date }}"
          if [ -n "${DATE_INPUT}" ]; then
            TARGET_DATE="${DATE_INPUT}"
          else
            TARGET_DATE="$(date -u +%F)"
          fi
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"

      - name: Check diff input
        shell: bash
        run: |
          DIFF_FILE="cache/diff/diff-${{ steps.dates.outputs.target_date }}.json"
          if [ ! -f "${DIFF_FILE}" ]; then
            echo "Diff file not found: ${DIFF_FILE}" >&2
            exit 1
          fi

      - name: Generate daily markdown page
        run: node scripts/generate-daily-page.js "${{ steps.dates.outputs.target_date }}"

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: generated-content-${{ steps.dates.outputs.target_date }}
          path: |
            content/updates
            cache/diff/diff-${{ steps.dates.outputs.target_date }}.json
          if-no-files-found: error
