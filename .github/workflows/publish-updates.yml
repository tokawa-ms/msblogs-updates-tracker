name: Publish Updates to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "content/updates/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if no content changes"
        required: false
        type: boolean
        default: false
      build_only:
        description: "Build and upload Astro HTML only, without deploying to GitHub Pages"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Run tests
        run: npm test

      - name: Generate static site
        run: npm run build

      - name: Upload Astro preview artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload pages artifact
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
          retention-days: 7

      - name: Report build-only result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        shell: bash
        run: |
          echo "### ✅ Astro HTML build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode:** Build only (no Pages deployment)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`astro-dist\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact path:** \`dist/\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment
        shell: bash
        run: |
          echo "### ✅ Deployed to GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
