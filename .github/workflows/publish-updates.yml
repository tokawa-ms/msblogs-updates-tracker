name: Publish Updates to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "content/updates/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if no content changes"
        required: false
        type: boolean
        default: false
      build_only:
        description: "Build Astro HTML only, without publishing to gh-pages"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish static site
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.mode.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate publish branch
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && github.ref_name != 'main' }}
        shell: bash
        run: |
          echo "Manual publishing to gh-pages is only allowed from the main branch." >&2
          echo "Use build_only=true when you want to test a feature branch build." >&2
          exit 1

      - name: Resolve deploy mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.build_only }}" = "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Run tests
        run: npm test

      - name: Generate static site
        run: npm run build

      - name: Setup Pages
        if: ${{ steps.mode.outputs.should_deploy == 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.mode.outputs.should_deploy == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Report build-only result
        if: ${{ steps.mode.outputs.should_deploy == 'false' }}
        shell: bash
        run: |
          mapfile -t html_files < <(find dist -type f -name '*.html' | sort)
          if [ "${#html_files[@]}" -eq 0 ]; then
            echo "No HTML files were generated in dist/." >&2
            exit 1
          fi
          echo "### ✅ Astro HTML build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode:** Build only (no Pages deployment)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Output directory:** \`dist/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Generated HTML files:**" >> "$GITHUB_STEP_SUMMARY"
          for file in "${html_files[@]}"; do
            echo "  - \`${file}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Report Pages deploy preparation
        if: ${{ steps.mode.outputs.should_deploy == 'true' }}
        shell: bash
        run: |
          echo "### ✅ Pages artifact prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment mode:** \`GitHub Actions\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`dist/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source ref:** \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ needs.build.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
