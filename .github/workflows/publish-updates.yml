name: Publish Updates to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "content/updates/**"
      - "src/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild even if no content changes"
        required: false
        type: boolean
        default: false
      build_only:
        description: "Build Astro HTML only, without publishing to gh-pages"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate publish branch
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.build_only && github.ref_name != 'main' }}
        shell: bash
        run: |
          echo "Manual publishing to gh-pages is only allowed from the main branch." >&2
          echo "Use build_only=true when you want to test a feature branch build." >&2
          exit 1

      - name: Install dependencies
        run: npm ci --loglevel=error

      - name: Run tests
        run: npm test

      - name: Generate static site
        run: npm run build

      - name: Publish to gh-pages branch
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Report build-only result
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
        shell: bash
        run: |
          mapfile -t html_files < <(find dist -type f -name '*.html' | sort)
          if [ "${#html_files[@]}" -eq 0 ]; then
            echo "No HTML files were generated in dist/." >&2
            exit 1
          fi
          echo "### ✅ Astro HTML build completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode:** Build only (no Pages deployment)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Output directory:** \`dist/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Generated HTML files:**" >> "$GITHUB_STEP_SUMMARY"
          for file in "${html_files[@]}"; do
            echo "  - \`${file}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Report gh-pages publish
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
        shell: bash
        run: |
          echo "### ✅ Published to gh-pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`gh-pages\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source ref:** \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
